name: Feature Request
description: Suggest an idea or enhancement for Home Cloud
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide details to help us understand your idea.
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe it clearly (e.g. "I'm always frustrated when...").
      placeholder: A clear and concise description of the problem or limitation you encountered.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or enhancement you would like to see implemented.
      placeholder: What should happen? How should it work?
    validations:
      required: true
  - type: dropdown
    id: affected-component
    attributes:
      label: Affected Component
      description: Which part of Home Cloud does this feature request impact?
      options:
        - Dashboard Web OS
        - Backend Agent Daemon
        - Docker App Store
        - Web Terminal
        - File Explorer
        - System Settings
        - Landing Page
        - Installer / CLI
    validations:
      required: true
  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions, workflows, or workarounds?
      placeholder: Any alternative approaches or tools you evaluated.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context & Mockups
      description: Add any other context, screenshots, or mockups about the feature request here.
      placeholder: Links, images, wireframes, or additional notes.
    validations:
      required: false
