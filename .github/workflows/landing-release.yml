name: Deploy landing on release

# Rebuilds home-cloud.live whenever a GitHub release is published, so the
# version, install command and Node.js minimum on the page follow the
# latest tag automatically (they are read from GitHub at build time in
# landing/src/data/site.ts).
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   token with "Workers Scripts: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account that owns the "home-cloud" worker

'on':
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy landing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Deploy the current site, not the landing code as it was at the tag.
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install landing dependencies
        run: pnpm install --frozen-lockfile --filter landing...

      - name: Build landing
        run: pnpm --filter landing build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare
        working-directory: landing
        run: pnpm dlx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
