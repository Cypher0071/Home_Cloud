name: Deploy landing

# Rebuilds and deploys home-cloud.live:
# - on every push to main (each merged PR), so site and docs changes go live;
# - whenever a GitHub release is published, so the version, install command,
#   Node.js minimum and changelog follow the latest tag (they are read from
#   GitHub at build time in landing/src/data/site.ts);
# - on demand from the Actions tab.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   token with "Workers Scripts: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account that owns the "home-cloud" worker

'on':
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy landing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Deploy the current site, not the landing code as it was at the tag.
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install landing dependencies
        run: pnpm install --frozen-lockfile --filter landing...

      - name: Build landing
        run: pnpm --filter landing build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloudflare
        working-directory: landing
        run: pnpm dlx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
